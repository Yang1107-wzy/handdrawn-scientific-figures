name: Offline validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install local rendering dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate portable skill
        run: python scripts/validate.py
      - name: Run offline core tests
        run: python -m unittest discover -s tests -v
      - name: Build distribution archives
        run: |
          python scripts/package.py --output dist/public.zip
          python scripts/package.py --skill-only --output dist/skill.zip
      - name: Build offline example if provided
        shell: python
        run: |
          import pathlib, subprocess, sys
          script = pathlib.Path('examples/build_examples.py')
          if script.is_file():
              subprocess.run([sys.executable, str(script)], check=True)
